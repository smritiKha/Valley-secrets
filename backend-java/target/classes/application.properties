spring.application.name=valley-secrets
spring.datasource.url=jdbc:h2:file:${user.home}/.valley-secrets/secretsdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
server.port=8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.admin.username=${VALLEY_ADMIN_USERNAME:smriti_admin}
app.admin.password=${VALLEY_ADMIN_PASSWORD:KathmanduSecrets2026!}
